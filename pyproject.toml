[project]
name = "research-council"
version = "0.0.1"
description = "Heterogeneous cross-vendor multi-agent debate for AI4SE research, grounded in executable verification."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx>=0.27",          # real retrieval (OpenAlex / arXiv); no key needed
    "questionary>=2.0",     # arrow-key setup menus + line-editing prompts
    "rich>=13.0",           # styled setup panels / summary tables / colored stream
    "pydantic-ai>=1.0",     # agentic peer: tool-loop + caps + typed output (cross-vendor)
]

[project.optional-dependencies]
# Real provider SDKs — not needed for the offline (stub) path.
providers = ["openai>=1.40", "anthropic>=0.34", "google-genai>=0.3"]
# FastAPI backend (the service runner).
service = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
council = "research_council.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_council"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"   # the package floor (requires-python >=3.12); UP rules target this

[tool.ruff.lint]
# Pragmatic set: pycodestyle errors, pyflakes, import sorting, pyupgrade, bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]          # the formatter handles code width; don't fail on long comments/strings
