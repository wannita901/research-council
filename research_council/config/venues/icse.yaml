name: ICSE (software engineering)
doc_class: acmart
page_limit: 10
rubric:
  novelty: Does it advance SE research beyond existing tools/studies?
  soundness: Rigorous empirical method — datasets, baselines (incl. SAST/existing tools), statistics, threats to validity?
  significance: Real impact on software-engineering practice or research?
  reproducibility: Artifact available, runnable, with a clear protocol?
  clarity: Well-motivated, well-structured, readable?
