# mise.toml — toolchain, venv, env, and tasks for research-council.
# Secrets live in mise.local.toml (gitignored): `cp mise.local.toml.example mise.local.toml`.

[tools]
python = "3.14"

[env]
# Auto-create + activate the project venv. Applied under `mise activate`, `mise run`, or `mise exec`.
_.python.venv = { path = ".venv", create = true }

# Model per provider seat — change these freely (override per-machine in mise.local.toml).
RC_OPENAI_MODEL = "gpt-5.4" # [ gpt-5.5 | gpt-5.4 | gpt-5.4-mini ]
RC_ANTHROPIC_MODEL = "claude-sonnet-4-6" # [ claude-opus-4-8 | claude-sonnet-4-6 | claude-haiku-4-5 ]
RC_GEMINI_MODEL = "gemini-3.5-flash" # [ gemini-3.1-pro-preview | gemini-3.5-flash | gemini-3.1-flash-lite ]

# Onboarding facilitator (writes the clarifying questions) — a Claude model; vendor fixed to anthropic.
# claude-haiku-4-5 is cheaper if your account has it enabled.
RC_FACILITATOR_MODEL = "claude-sonnet-4-6" # [ claude-opus-4-8 | claude-sonnet-4-6 | claude-haiku-4-5 ]

# ───────────────────────── caps ─────────────────────────
# Stage B/C loop preset — the main knob. conservative=cheap/fast, thorough=more iters/budget.
RC_PROFILE = "balanced"     # [ conservative | balanced | thorough ]
#
# Every individual cap is overridable too. The lines below show the CODE DEFAULTS — uncomment
# any to override the profile/default (an uncommented per-field value WINS over the profile).
#
# Stage A · ideation (the agentic debate)
# RC_MAX_ITERS = "5"          # per-peer research/deliberate loop iterations (per call)
# RC_MAX_TOOL_CALLS = "8"     # per-peer tool calls (per call) — each peer has its OWN budget
# RC_MAX_TURNS = "4"          # deliberation free-form sub-rounds per ideation round
# RC_MAX_ROUNDS = "4"         # full ideation rounds (hard safety ceiling is 8)
# RC_MAX_MSGS_PER_PEER = "3"  # deliberation messages per peer per round (1 mandatory opening + free-form)
# RC_USD_MAX = "5.0"          # soft per-ideation-run USD budget
#
# Stage B · experimentation (one council loop per research question) — balanced shown
# RC_STAGEB_MAX_ITERS = "3"       # implement→run→review cycles per RQ
# RC_STAGEB_K = "2"               # reviewer approvals required (of 2) to pass an RQ
# RC_STAGEB_USD = "1.50"          # USD budget per RQ
# RC_STAGEB_TIMEOUT = "30"        # sandbox seconds per run
# RC_STAGEB_PROBE_TIMEOUT = "15"  # sandbox seconds for a reviewer verification probe
#
# Stage C · writing (draft → PC review → revise → LaTeX build-fix) — balanced shown
# RC_STAGEC_MAX_REVISIONS = "3"      # revision rounds
# RC_STAGEC_ACCEPT = "0.70"          # mean rubric score to accept
# RC_STAGEC_USD = "1.50"             # USD budget for the writing loop
# RC_STAGEC_LATEX_FIX_ATTEMPTS = "3" # LaTeX build-verify-fix attempts

[tasks.deps]
description = "Install the package + dev, provider & service deps into the venv"
run = "pip install -e '.[dev,providers,service]'"

[tasks.serve]
description = "Run the FastAPI backend at http://127.0.0.1:8000"
run = "uvicorn research_council.service.app:app --host 127.0.0.1 --port 8000"

[tasks.test]
description = "Run the test suite"
run = "pytest -q"

[tasks.build-image]
description = "Build the Stage-B experiment sandbox image (numpy/pandas/scipy/sklearn) for real experiments"
run = "docker build -t research-council-exp:latest -f docker/experiment.Dockerfile ."

[tasks.check]
description = "Ping each provider with a tiny prompt (diagnose live setup; ~cents)"
run = "council check"

[tasks.debate]
description = "Offline debate. Pass args after --, e.g. mise run debate -- --topic '...'"
run = "council debate"

[tasks.live]
description = "Live 3-vendor debate (spends tokens; needs keys in mise.local.toml)"
run = "council debate --live"

[tasks.ideate]
description = "v2 agentic ideation (offline stub; add -- --live for real)"
run = "council ideate"
