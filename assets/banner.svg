<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="research-council — From question to paper, an autonomous multi-agent research council for AI4SE research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16263d"/>
      <stop offset="0.55" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#3b6ea5"/>
    </linearGradient>
    <style>
      .wm   { font: 700 66px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .tag  { font: 400 25px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #dce8ff; }
      .chip { font: 600 22px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #eaf2ff; }
      .arrow{ font: 600 22px ui-sans-serif, sans-serif; fill: #8fb6e6; }
      .foot { font: 500 19px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #9ec1ec; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="10" height="300" rx="5" fill="#f6c453"/>

  <!-- wordmark -->
  <g transform="translate(70,108)">
    <path d="M0,-26 L26,0 L0,26 L-26,0 Z" fill="none" stroke="#f6c453" stroke-width="5" transform="translate(26,0)"/>
    <text class="wm" x="78" y="22">research-council</text>
  </g>

  <!-- tagline -->
  <text class="tag" x="72" y="170">From question to paper — an autonomous multi-agent research council for AI4SE research.</text>

  <!-- lifecycle motif -->
  <g transform="translate(72,210)">
    <rect x="0" y="0" width="190" height="50" rx="25" fill="#ffffff" fill-opacity="0.10" stroke="#5b8fc9" stroke-width="1.5"/>
    <text class="chip" x="95" y="32" text-anchor="middle">ideation</text>
    <text class="arrow" x="210" y="32" text-anchor="middle">→</text>
    <rect x="245" y="0" width="270" height="50" rx="25" fill="#ffffff" fill-opacity="0.10" stroke="#5b8fc9" stroke-width="1.5"/>
    <text class="chip" x="380" y="32" text-anchor="middle">experimentation</text>
    <text class="arrow" x="540" y="32" text-anchor="middle">→</text>
    <rect x="575" y="0" width="170" height="50" rx="25" fill="#ffffff" fill-opacity="0.10" stroke="#5b8fc9" stroke-width="1.5"/>
    <text class="chip" x="660" y="32" text-anchor="middle">writing</text>
  </g>

  <!-- cross-vendor footer -->
  <text class="foot" x="1128" y="285" text-anchor="end">cross-vendor council · OpenAI · Anthropic · Google</text>
</svg>
