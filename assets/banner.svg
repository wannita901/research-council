<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="research-council — From question to paper, an autonomous multi-agent research council for AI4SE research">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <style>
      .wm   { font: 700 66px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #16263d; }
      .tag  { font: 400 24px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #48566e; }
      .chip { font: 600 22px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1e3a5f; }
      .arrow{ font: 600 22px ui-sans-serif, sans-serif; fill: #9aaecb; }
      .foot { font: 500 18px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6b7a92; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="22" fill="url(#bg)" stroke="#dce2ea" stroke-width="1.5"/>
  <rect x="0" y="0" width="10" height="300" rx="5" fill="#3b6ea5"/>

  <g transform="translate(70,108)">
    <path d="M0,-26 L26,0 L0,26 L-26,0 Z" fill="none" stroke="#3b6ea5" stroke-width="5" transform="translate(26,0)"/>
    <text class="wm" x="78" y="22">research-council</text>
  </g>

  <text class="tag" x="72" y="170">From question to paper — an autonomous multi-agent research council for AI4SE research.</text>

  <g transform="translate(72,210)">
    <rect x="0" y="0" width="190" height="50" rx="25" fill="#f3f6fb" stroke="#d3deec" stroke-width="1.5"/>
    <text class="chip" x="95" y="32" text-anchor="middle">ideation</text>
    <text class="arrow" x="210" y="32" text-anchor="middle">→</text>
    <rect x="245" y="0" width="270" height="50" rx="25" fill="#f3f6fb" stroke="#d3deec" stroke-width="1.5"/>
    <text class="chip" x="380" y="32" text-anchor="middle">experimentation</text>
    <text class="arrow" x="540" y="32" text-anchor="middle">→</text>
    <rect x="575" y="0" width="170" height="50" rx="25" fill="#f3f6fb" stroke="#d3deec" stroke-width="1.5"/>
    <text class="chip" x="660" y="32" text-anchor="middle">writing</text>
  </g>

  <text class="foot" x="1128" y="285" text-anchor="end">cross-vendor council · OpenAI · Anthropic · Google</text>
</svg>
